<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remises Pinamar · Chofer</title><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest-chofer.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Remis Chofer">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#071a2b;--ink2:#0f3047;--teal:#0e8a86;--teal2:#0a6866;--gold:#e0b04f;--gold2:#a77c1c;--foam:#eef4f7;--line:#d3e0e8;--mut:#5b7283;--ok:#12a672;--er:#d6453d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Manrope,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:radial-gradient(900px 500px at 90% -5%,#cfe8ea 0,transparent 60%),radial-gradient(700px 500px at -10% 30%,#f3e9d2 0,transparent 55%),linear-gradient(180deg,#e9f1f5,#f8fbfc) fixed}
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden;perspective:1100px;border-bottom:3px solid var(--gold)}
.tiles{position:absolute;inset:-20px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;transform-style:preserve-3d}
.tiles div{background:#000 center/cover;filter:brightness(.7) saturate(1.05);scale:1.12;translate:calc(var(--mx,0)*-16px) calc(var(--my,0)*-9px);transition:translate .5s ease-out;animation:kb 26s ease-in-out infinite alternate;border-radius:10px;box-shadow:0 20px 40px #0008}
.tiles div:nth-child(1){transform:rotateY(8deg) translateZ(-30px)}.tiles div:nth-child(3){transform:rotateY(-8deg) translateZ(-30px)}
@keyframes kb{to{scale:1.26}}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(95deg,#04101c 8%,#04101cd0 45%,#0e8a8633 100%)}
.hi{position:relative;z-index:2;max-width:1250px;margin:auto;padding:64px 24px 44px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
h1{margin:0;font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-2px;line-height:1;text-shadow:0 6px 24px #0009}.hi p{margin:12px 0 0;opacity:.85;font-size:16px}
#clk{background:#ffffff1f;backdrop-filter:blur(10px);border:1px solid #ffffff4d;color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
#inst{background:linear-gradient(180deg,#f0c968,#d19d2c)!important;color:var(--ink)!important;box-shadow:0 3px 0 var(--gold2),0 8px 16px #0006!important}
nav#roles{background:var(--ink);padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
main{max-width:1250px;margin:auto;padding:26px 24px 52px}
button{background:linear-gradient(180deg,#13a39e,var(--teal2));color:#fff;border:0;border-radius:12px;padding:11px 17px;font:700 14px Manrope,sans-serif;cursor:pointer;box-shadow:0 4px 0 #084c4a,0 10px 18px -4px #084c4a88,inset 0 1px 0 #ffffff55;transition:transform .12s,box-shadow .12s,filter .15s;position:relative;top:0}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #084c4a,0 3px 6px #084c4a66,inset 0 1px 0 #ffffff33}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav button{background:#ffffff18;box-shadow:none}
.tabs{display:inline-flex;background:#dbe8ee;border-radius:999px;padding:5px;gap:3px;margin-bottom:20px;flex-wrap:wrap;box-shadow:inset 0 3px 6px #0a2a3d33}
.tabs button{background:transparent;color:var(--ink2);box-shadow:none;border-radius:999px}
.tabs button:hover{background:#ffffff88;transform:none}
.tabs button.on{background:linear-gradient(180deg,#143b57,var(--ink));color:#fff;box-shadow:0 3px 0 var(--gold),0 8px 14px #071a2b55}
.s{padding:5px 12px;font-size:12px;border-radius:999px;box-shadow:0 3px 0 #084c4a,0 6px 10px -3px #084c4a88,inset 0 1px 0 #ffffff55}
.r{background:linear-gradient(180deg,#e5625a,#b8322b);box-shadow:0 4px 0 #7f1f1a,0 10px 18px -4px #7f1f1a88,inset 0 1px 0 #ffffff55}.s.r{box-shadow:0 3px 0 #7f1f1a,inset 0 1px 0 #ffffff55}
.o{background:linear-gradient(180deg,#1ec48a,#0c8a5e);box-shadow:0 4px 0 #066042,0 10px 18px -4px #06604288,inset 0 1px 0 #ffffff55}.s.o{box-shadow:0 3px 0 #066042,inset 0 1px 0 #ffffff55}
.w{background:linear-gradient(180deg,#fff,#dde8ee);color:var(--ink);box-shadow:0 4px 0 #b3c5d0,0 8px 14px -4px #0a2a3d44,inset 0 1px 0 #fff}.s.w{box-shadow:0 3px 0 #b3c5d0}
.big{font-size:16px;padding:17px 22px;width:100%;margin:8px 0 10px;border-radius:14px}
.card{background:linear-gradient(180deg,#fff,#f7fafc);border:1px solid #fff;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 1px 0 #fff inset,0 2px 4px #0a2a3d14,0 18px 36px -16px #0a2a3d55;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 0 #fff inset,0 4px 8px #0a2a3d1a,0 28px 44px -18px #0a2a3d66}
.card h3{margin:0 0 14px;font-size:21px;font-weight:800;letter-spacing:-.5px}
.g2,.g3{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1.3fr}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.tiles div:nth-child(3){display:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(150deg,#164563,var(--ink) 70%);color:#fff;border-radius:20px;padding:18px 18px 16px;border-bottom:4px solid var(--gold);box-shadow:inset 0 1px 0 #ffffff33,0 22px 30px -14px #071a2b99;transition:transform .2s ease-out;will-change:transform}
.kpi b{display:block;font-size:30px;letter-spacing:-1px;text-shadow:0 3px 8px #0006}.kpi span{color:#9fbdd0;font-size:13px}
.q{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.q b{background:linear-gradient(180deg,#f2cf79,#d0a038);color:var(--ink);min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 0 var(--gold2),0 6px 10px #0004}.q span{flex:1}
.tag{background:linear-gradient(180deg,#f2cf79,#d0a038);color:var(--ink);font:800 11px Manrope,sans-serif;padding:3px 10px;border-radius:999px;vertical-align:middle;letter-spacing:.5px;box-shadow:0 2px 0 var(--gold2)}
.mut{color:var(--mut)}
input,select{width:100%;padding:13px 14px;background:#eef4f7;border:1px solid transparent;border-radius:12px;margin:4px 0 10px;font:inherit;box-shadow:inset 0 3px 6px #0a2a3d1f,0 1px 0 #fff}
input:focus,select:focus{background:#fff;border-color:var(--teal)}
label{font-weight:700;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);padding:8px;font-size:12px;font-weight:700;border-bottom:2px solid var(--ink)}td{padding:11px 8px;border-bottom:1px solid var(--line)}tr:hover td{background:#eef6f8}
.tw{overflow-x:auto}#map{height:540px;border-radius:20px;border:4px solid #fff;box-shadow:0 24px 44px -18px #071a2b88}
.pin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 10px #0007;font-size:15px;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 4px 10px #0007,0 0 0 0 var(--pc,#0e8a8688)}100%{box-shadow:0 4px 10px #0007,0 0 0 16px #0000}}
.crono{font:800 68px/1 Manrope,sans-serif;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin:16px 0 4px;text-align:center;background:linear-gradient(180deg,#143b57,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 8px #0e8a8644)}.center{text-align:center}
.cover{position:relative;height:210px;border-radius:22px;background:#000 center/cover;margin-bottom:18px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;box-shadow:0 26px 40px -18px #071a2bcc;transition:transform .2s ease-out;will-change:transform}
.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#04101cee,#04101c00 75%)}.cover *{position:relative;margin:0}.cover h2{font-size:30px;font-weight:800;letter-spacing:-1px}.cover p{opacity:.88;margin-top:4px}
.st{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#e1edf2;white-space:nowrap}
footer{background:var(--ink);color:#8fa9ba;text-align:center;padding:28px;border-top:3px solid var(--gold)}footer b{color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(22px) rotateX(8deg)}to{opacity:1;transform:none}}
body.intro main>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}body.intro main>*:nth-child(2){animation-delay:.1s}body.intro main>*:nth-child(3){animation-delay:.2s}body.intro main>*:nth-child(4){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}

 zonas:{Pinamar:[-37.1084,-56.8551],Ostende:[-37.1335,-56.8700]}};
/* ===== DATOS ===== */
const K='gsm_remis_v2',$=id=>document.getElementById(id),M=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const hms=ms=>{let s=Math.floor(ms/1000);return[s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,0)).join(':')};
const fh=t=>new Date(t).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});
function seed(){return{ch:[],pa:[],vi:[],cj:[],seq:100}}
function load(){try{return JSON.parse(localStorage[K])}catch(e){return seed()}}
const db=window.firebase&&window.FIREBASE_CONFIG&&/^https:/.test(FIREBASE_CONFIG.databaseURL||'')?(firebase.initializeApp(FIREBASE_CONFIG),firebase.database()):null;
let S=db?seed():load(),ui={rol:ROL||'operador',tab:'despacho',ch:+localStorage.gsm_ch||0,gps:null};
/* ===== NUBE (Firebase) ===== */
let GOT={},LAST={},off=[];
const KEY={ch:x=>x.id,pa:x=>'t'+String(x.tel).replace(/\D/g,''),vi:x=>x.id,cj:x=>x.ts+'_'+x.vid};
const uid=()=>((Date.now()/1000|0)%100000000)*10+(Math.random()*10|0);
const NEED=()=>!ROL?['ch','pa','vi','cj','seq']:ROL=='chofer'?(ui.ch?['ch','vi']:['ch']):(localStorage.gsm_tel?['ch','vi']:['ch']);
const READY=()=>!db||NEED().every(n=>GOT[n]);
function snap(n){if(n=='seq'){LAST.seq=S.seq;return}LAST[n]={};S[n].forEach(x=>LAST[n][KEY[n](x)]=JSON.stringify(x))}
function save(){if(!db){try{localStorage[K]=JSON.stringify(S)}catch(e){}return}
 const u={},del=READY();
 ['ch','pa','vi','cj'].forEach(n=>{const o=LAST[n]||{},cur={};S[n].forEach(x=>{const k=KEY[n](x),s=JSON.stringify(x);cur[k]=1;if(o[k]!==s){u[n+'/'+k]=JSON.parse(s);o[k]=s}});if(del)for(const k in o)if(!cur[k]){u[n+'/'+k]=null;delete o[k]}LAST[n]=o});
 if(!ROL&&LAST.seq!==S.seq){u.seq=S.seq;LAST.seq=S.seq}
 if(Object.keys(u).length)db.ref().update(u)}
function sync(){off.forEach(f=>f());off=[];GOT={};if(!db)return;
 const L=(n,r)=>{const f=r.on('value',s=>{const v=s.val();S[n]=n=='seq'?(v||100):Object.values(v||{}).sort((a,b)=>(a.id||a.ts)-(b.id||b.ts));snap(n);GOT[n]=1;despachar();refresh()});off.push(()=>r.off('value',f))};
 L('ch',db.ref('ch'));
 if(!ROL){L('pa',db.ref('pa'));L('vi',db.ref('vi'));L('cj',db.ref('cj'));L('seq',db.ref('seq'))}
 else if(ROL=='chofer'&&ui.ch)L('vi',db.ref('vi').orderByChild('ch').equalTo(ui.ch));
 else if(ROL=='pasajero'&&localStorage.gsm_tel)L('vi',db.ref('vi').orderByChild('tel').equalTo(localStorage.gsm_tel))}
function despachar(){if(ROL||!READY())return;S.vi.forEach(v=>{if(v.tel&&!S.pa.some(p=>KEY.pa(p)==KEY.pa(v)))S.pa.push({id:uid(),n:v.pn,tel:v.tel,dir:v.or,nv:0,alta:Date.now()});if(v.est=='fin'&&!v.cnt){v.cnt=1;const p=S.pa.find(x=>KEY.pa(x)==KEY.pa(v));if(p)p.nv++}});['Ostende','Pinamar'].forEach(asignar);save()}

function asignar(z){if(ROL)return;S.vi.filter(v=>v.est=='pend'&&v.z==z).forEach(v=>{const c=cola(z)[0];if(c){v.ch=c.id;v.est='curso';c.est='viaje';c.cola=null}})}
function jornada(id){const c=S.ch.find(x=>x.id==id);if(c.est=='viaje')return alert('Finalice el viaje en curso antes de cerrar la jornada.');
 if(c.ini){c.acum+=Date.now()-c.ini;c.ini=null;c.est='off';c.cola=null;if(W[id]!=null){navigator.geolocation.clearWatch(W[id]);delete W[id]}c.lat=null;c.gps=0}else{c.ini=Date.now();c.est='libre'}save();R()}
function entrarCola(id,z){const c=S.ch.find(x=>x.id==id);if(!c.ini)return alert('Primero inicie la jornada.');c.cola=z;c.est='libre';c.qts=Date.now();asignar(z);save();R()}
function salirCola(id){S.ch.find(x=>x.id==id).cola=null;save();R()}
function pedir(){if(!ui.gps&&ui.rol=='pasajero'&&navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{ui.gps=[p.coords.latitude,p.coords.longitude];pedir2()},()=>pedir2(),{timeout:7000});else pedir2()}
function pedir2(){const v=k=>$(k).value.trim();if(!v('fn')||!v('ft')||!v('fd'))return alert('Complete nombre, teléfono y dirección de retiro.');
 const z=v('fz'),pos=ui.gps;ui.gps=null;
 S.vi.push({id:uid(),ts:Date.now(),pn:v('fn'),tel:v('ft'),or:v('fd'),de:v('fx'),z,monto:+($('fm')?$('fm').value:0)||CFG.tarifa,est:'pend',ch:null,lat:pos?pos[0]:null,lng:pos?pos[1]:null});
 if(ROL){localStorage.gsm_tel=v('ft');localStorage.gsm_n=v('fn')}asignar(z);despachar();save();if(ROL=='pasajero')sync();R()}
function fin(id,met){const v=S.vi.find(x=>x.id==id),c=S.ch.find(x=>x.id==v.ch),rz=$('rz')?$('rz').value:v.z;
 v.est='fin';v.met=met;S.cj.push({ts:Date.now(),vid:v.id,pn:v.pn,ch:c.id,met,monto:v.monto});c.tot+=v.monto;c.vj++;c.est='libre';c.cola=rz;c.qts=Date.now();
 asignar(rz);despachar();save();R()}
function canc(id){const v=S.vi.find(x=>x.id==id),c=S.ch.find(x=>x.id==v.ch);if(c){c.est='libre';c.cola=v.z;c.qts=Date.now()}v.est='canc';asignar(v.z);save();R()}
function altaCh(){const n=$('an').value.trim(),v=$('am').value.trim(),mv=/^\d+$/.test(v)?'Móvil '+v:v;if(!n||!v)return alert('Complete nombre y número de móvil.');if(S.ch.some(x=>norm(x.mv)==norm(mv)))return alert('Ese número de móvil ya está registrado.');S.ch.push({id:++S.seq,n,mv,pat:$('ap').value,est:'off',ini:null,acum:0,cola:null,qts:0,vj:0,tot:0,lat:null,lng:null});save();R()}
function altaPa(){const n=$('pn').value.trim();if(!n||!$('pt').value.trim())return alert('Complete nombre y teléfono.');S.pa.push({id:uid(),n,tel:$('pt').value,dir:$('pd').value,nv:0,alta:Date.now()});save();R()}
function bajaPa(id){if(confirm('¿Eliminar pasajero?')){S.pa=S.pa.filter(p=>p.id!=id);save();R()}}
function cierre(){imp(`<h3>CIERRE DE CAJA</h3><p>${fh(Date.now())}</p><hr>`+S.cj.map(x=>`<div class=r><span>#${x.vid} ${x.met}</span><span>${M(x.monto)}</span></div>`).join('')+`<hr><div class=r><b>TOTAL</b><b>${M(S.cj.reduce((a,x)=>a+x.monto,0))}</b></div><p>Viajes: ${S.cj.length}</p><p>Global System · Marcelo Muraña</p>`);
 if(S.cj.length&&confirm('¿Cerrar la caja y reiniciar el día?')){S.cj=[];S.vi=S.vi.filter(v=>v.est=='pend'||v.est=='curso');S.ch.forEach(c=>{c.tot=0;c.vj=0;c.acum=0;if(c.ini)c.ini=Date.now()});save();R()}}
/* ===== IMPRESIÓN ===== */
function imp(h){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentWindow.document;d.open();
 d.write('<html><head><style>body{font:12px monospace;width:72mm;margin:0 auto}h3,p{text-align:center;margin:3px}.r{display:flex;justify-content:space-between}hr{border:0;border-top:1px dashed #000}</style></head><body>'+h+'</body></html>');d.close();
 setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),3000)},300)}
function ticket(id){const v=S.vi.find(x=>x.id==id),c=S.ch.find(x=>x.id==v.ch)||{n:'—',mv:'',pat:''};
 imp(`<h3>REMISES PINAMAR</h3><p>Ticket de viaje Nº ${v.id}</p><hr><div class=r><span>Fecha</span><span>${fh(v.ts)}</span></div><div class=r><span>Pasajero</span><span>${v.pn}</span></div><div class=r><span>Desde</span><span>${v.or}</span></div><div class=r><span>Hasta</span><span>${v.de||'-'}</span></div><div class=r><span>Zona</span><span>${v.z}</span></div><div class=r><span>Chofer</span><span>${c.n}</span></div><div class=r><span>Móvil</span><span>${c.mv} ${c.pat}</span></div><hr><div class=r><b>TOTAL</b><b>${M(v.monto)}</b></div><p>Pago: ${v.met||'a abonar'}</p><hr><p>¡Gracias por viajar con nosotros!</p><p>Global System · Marcelo Muraña</p>`)}
function tirilla(id){const c=S.ch.find(x=>x.id==id),vs=S.vi.filter(v=>v.ch==id&&v.est=='fin'),com=c.tot*CFG.comision/100;
 imp(`<h3>LIQUIDACIÓN CHOFER</h3><p>${fh(Date.now())}</p><hr><div class=r><span>Chofer</span><span>${c.n}</span></div><div class=r><span>Móvil</span><span>${c.mv} ${c.pat}</span></div><div class=r><span>Horas trabajadas</span><span>${hms(worked(c))}</span></div><hr>`+vs.map(v=>`<div class=r><span>#${v.id} ${v.z}</span><span>${M(v.monto)}</span></div>`).join('')+`<hr><div class=r><span>Viajes</span><span>${c.vj}</span></div><div class=r><span>Recaudado</span><span>${M(c.tot)}</span></div><div class=r><span>Comisión base ${CFG.comision}%</span><span>${M(com)}</span></div><div class=r><b>Neto chofer</b><b>${M(c.tot-com)}</b></div><br><p>Firma: ________________</p><p>Global System · Marcelo Muraña</p>`)}
/* ===== VISTAS ===== */
function R(){$('app').innerHTML=({operador:vOp,chofer:vCh,pasajero:vPa})[ui.rol]();
 $('roles').style.display='none';
 if(ui.rol=='chofer'){const c=S.ch.find(x=>x.id==ui.ch);if(c&&c.ini&&W[c.id]==null)gps(c.id,1)}
 if(ui.rol=='operador'&&ui.tab=='mapa')iniMapa()}
const TABS=['despacho','mapa','caja','pasajeros','choferes'];
function vOp(){return`<div class="tabs">${TABS.map(t=>`<button class="${t==ui.tab?'on':''}" onclick="ui.tab='${t}';R()">${{despacho:'Despacho',mapa:'Mapa',caja:'Caja',pasajeros:'Base de pasajeros',choferes:'Flota y choferes'}[t]}</button>`).join('')}</div>`+({despacho:tDesp,mapa:()=>'<div id="map"></div><p class="mut">🟢 Móvil libre · ⚫ Móvil en viaje · 🟡 Pasajero esperando</p>',caja:tCaja,pasajeros:tPas,choferes:tCho})[ui.tab]()}
function formViaje(op){return`<div class="card"><h3>${op?'Nuevo viaje':'Pedir un remís'}</h3><label>Nombre</label><input id="fn" value="${ROL&&localStorage.gsm_n||''}"><label>Teléfono</label><input id="ft" value="${ROL&&localStorage.gsm_tel||''}"><label>Dirección de retiro</label><input id="fd"><label>Destino</label><input id="fx"><label>Zona de salida</label><select id="fz"><option>Pinamar</option><option>Ostende</option></select>${op?`<label>Tarifa ($)</label><input id="fm" type="number" value="${CFG.tarifa}">`:`<p class="mut">Tarifa estimada: <b>${M(CFG.tarifa)}</b></p><p class="mut">📍 Al solicitar, el navegador te pedirá compartir tu ubicación para que el móvil te encuentre.</p>`}<button class="big" onclick="pedir()">Solicitar remís</button></div>`}
function filaV(v,acc){const c=S.ch.find(x=>x.id==v.ch);return`<tr><td>#${v.id}</td><td>${fh(v.ts)}</td><td>${v.pn}</td><td>${v.or} → ${v.de||'-'}</td><td>${v.z}</td><td>${c?c.mv+' · '+c.n:'—'}</td><td><span class="st">${ESTV[v.est]}</span></td><td>${M(v.monto)}</td><td>${acc(v)}</td></tr>`}
function tDesp(){const q=z=>`<div class="card"><h3>Cola ${z} <span class="tag">FIFO</span></h3>${cola(z).map((c,i)=>`<div class="q"><b>${i+1}</b><span>${c.mv} · ${c.n}</span><button class="s r" onclick="salirCola(${c.id})">✕</button></div>`).join('')||'<p class="mut">Sin móviles en cola. Los choferes se ubican desde su panel.</p>'}</div>`;
 const act=S.ch.filter(c=>c.est!='off').length,caja=S.cj.reduce((a,x)=>a+x.monto,0);
 return`<div class="cover" style="background-image:url(${IMG[0]})"><h2>Central de despacho</h2><p>${act} móviles activos · ${S.vi.filter(v=>v.est=='pend').length} pedidos esperando</p></div><div class="kpis"><div class="kpi"><b>${act}</b><span>Móviles activos</span></div><div class="kpi"><b>${cola('Ostende').length}</b><span>En cola Ostende</span></div><div class="kpi"><b>${cola('Pinamar').length}</b><span>En cola Pinamar</span></div><div class="kpi"><b>${S.vi.filter(v=>v.est=='pend').length}</b><span>Pedidos sin móvil</span></div><div class="kpi"><b>${M(caja)}</b><span>Caja del día</span></div></div>
 <div class="g3">${q('Ostende')}${q('Pinamar')}${formViaje(1)}</div><div class="card"><h3>Viajes</h3><div class="tw"><table><tr><th>Nº</th><th>Hora</th><th>Pasajero</th><th>Recorrido</th><th>Zona</th><th>Móvil</th><th>Estado</th><th>Monto</th><th></th></tr>${S.vi.slice().reverse().slice(0,30).map(v=>filaV(v,v=>(v.est=='curso'?`<button class="s o" onclick="fin(${v.id},'Efectivo')">Cobrar efectivo</button> <button class="s" onclick="fin(${v.id},'Tarjeta/MP')">Tarjeta/MP</button> `:'')+(v.est=='pend'||v.est=='curso'?`<button class="s r" onclick="canc(${v.id})">Cancelar</button> `:'')+(v.est!='canc'?`<button class="s w" onclick="ticket(${v.id})">🖨 Ticket</button>`:''))).join('')||'<tr><td colspan=9 class="mut">Todavía no hay viajes cargados.</td></tr>'}</table></div></div>`}
function tCaja(){const t=m=>S.cj.filter(x=>!m||x.met==m).reduce((a,x)=>a+x.monto,0);
 return`<div class="kpis"><div class="kpi"><b>${M(t())}</b><span>Total recaudado</span></div><div class="kpi"><b>${M(t('Efectivo'))}</b><span>Efectivo</span></div><div class="kpi"><b>${M(t('Tarjeta/MP'))}</b><span>Tarjeta / Mercado Pago</span></div><div class="kpi"><b>${S.cj.length}</b><span>Viajes cobrados</span></div></div><div class="card"><h3>Movimientos de caja</h3><div class="tw"><table><tr><th>Hora</th><th>Viaje</th><th>Pasajero</th><th>Chofer</th><th>Medio</th><th>Monto</th></tr>${S.cj.slice().reverse().map(x=>`<tr><td>${fh(x.ts)}</td><td>#${x.vid}</td><td>${x.pn}</td><td>${nom(x.ch)}</td><td>${x.met}</td><td>${M(x.monto)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">Sin movimientos. Los cobros aparecen al finalizar cada viaje.</td></tr>'}</table></div><br><button onclick="cierre()">🖨 Imprimir cierre y cerrar caja</button></div>`}
function tPas(){return`<div class="card"><h3>Base de datos de pasajeros</h3><input placeholder="Buscar por nombre, teléfono o dirección…" oninput="const q=this.value.toLowerCase();document.querySelectorAll('#tp tr.d').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')"><div class="tw"><table id="tp"><tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th>Viajes</th><th>Alta</th><th></th></tr>${S.pa.map(p=>`<tr class="d"><td>${p.n}</td><td>${p.tel}</td><td>${p.dir}</td><td>${p.nv}</td><td>${fh(p.alta)}</td><td><button class="s r" onclick="bajaPa(${p.id})">Eliminar</button></td></tr>`).join('')}</table></div></div><div class="card"><h3>Agregar pasajero</h3><div class="g3"><div><input id="pn" placeholder="Nombre"></div><div><input id="pt" placeholder="Teléfono"></div><div><input id="pd" placeholder="Dirección"></div></div><button onclick="altaPa()">Guardar pasajero</button></div>`}
function tCho(){return`<div class="card"><h3>Choferes y móviles</h3><div class="tw"><table><tr><th>Móvil</th><th>Chofer</th><th>Patente</th><th>Estado</th><th>Horas</th><th>Viajes</th><th>Recaudado</th><th></th></tr>${S.ch.map(c=>`<tr><td>${c.mv}</td><td>${c.n}</td><td>${c.pat}</td><td><span class="st">${c.est=='off'?'Fuera de turno':c.est=='viaje'?'🚕 En viaje':c.cola?'En cola '+c.cola:'Libre'}</span></td><td data-c="${c.id}"><b>${hms(worked(c))}</b></td><td>${c.vj}</td><td>${M(c.tot)}</td><td><button class="s ${c.ini?'r':'o'}" onclick="jornada(${c.id})">${c.ini?'⏹ Fin':'▶ Inicio'}</button> <button class="s" onclick="entrarCola(${c.id},'Ostende')">→ Ostende</button> <button class="s" onclick="entrarCola(${c.id},'Pinamar')">→ Pinamar</button> <button class="s w" onclick="tirilla(${c.id})">🧾 Tirilla</button> <button class="s r" onclick="bajaCh(${c.id})">Baja</button></td></tr>`).join('')||'<tr><td colspan=8 class="mut">Todavía no hay choferes. Cárguelos abajo en Alta de chofer.</td></tr>'}</table></div></div><div class="card"><h3>Alta de chofer</h3><div class="g3"><div><input id="an" placeholder="Nombre y apellido"></div><div><input id="am" placeholder="Nº de móvil (ej. 12)"></div><div><input id="ap" placeholder="Patente"></div></div><button onclick="altaCh()">Agregar chofer</button></div>`}
const norm=s=>String(s).toLowerCase().replace(/m[óo]vil|n[°º]|\s/g,'');
function vLogin(){return`<div class="cover" style="background-image:url(${IMG[2]})"><h2>Ingreso de choferes</h2><p>Usá tu número de móvil.</p></div><div class="card" style="max-width:420px"><label>Número de móvil</label><input id="lm" inputmode="numeric" onkeydown="if(event.key=='Enter')loginCh()"><button class="big" onclick="loginCh()">Ingresar</button></div>`}
function loginCh(){if(!READY())return alert('Conectando con la central… probá de nuevo en unos segundos.');if(!db)S=load();const m=norm($('lm').value),c=m&&S.ch.find(x=>norm(x.mv)==m);if(!c)return alert('Ese número de móvil no está registrado. Consultá con la central.');ui.ch=c.id;localStorage.gsm_ch=c.id;sync();R()}
function salirCh(){ui.ch=0;localStorage.removeItem('gsm_ch');R()}
function bajaCh(id){const c=S.ch.find(x=>x.id==id);if(c.est=='viaje')return alert('El chofer tiene un viaje en curso.');if(confirm('¿Dar de baja a '+c.n+'? Ya no podrá ingresar.')){S.ch=S.ch.filter(x=>x.id!=id);save();R()}}
function vCh(){const c=S.ch.find(x=>x.id==ui.ch);if(!c)return vLogin();const v=S.vi.find(x=>x.ch==c.id&&x.est=='curso'),pos=c.cola?cola(c.cola).findIndex(x=>x.id==c.id)+1:0;
 return`<div class="cover" style="background-image:url(${IMG[2]})"><h2>${c.n}</h2><p>${c.mv} · ${c.pat}</p></div><div class="g2"><div class="card center"><h3>Tu jornada</h3><button class="s w" onclick="salirCh()">Cerrar sesión</button>
 <div class="crono" data-c="${c.id}">${hms(worked(c))}</div><p class="mut">Horas trabajadas en el turno</p>
 <button class="big ${c.ini?'r':'o'}" onclick="jornada(${c.id})">${c.ini?'⏹ Terminar jornada':'▶ Iniciar jornada'}</button>
 ${c.ini&&!v?`<p><b>Ubicarme en la cola:</b></p><button class="big" onclick="entrarCola(${c.id},'Ostende')">Cola Ostende</button><button class="big" onclick="entrarCola(${c.id},'Pinamar')">Cola Pinamar</button>${c.cola?`<p>Estás en <b>${c.cola}</b>, posición <b>${pos}</b></p><button class="s r" onclick="salirCola(${c.id})">Salir de la cola</button>`:''}`:''}
 <p><span class="mut">📍 Ubicación: ${c.gps?"compartida con la central":"se activa al iniciar la jornada"}</span> <button class="s" onclick="tirilla(${c.id})">🧾 Imprimir tirilla</button></p></div>
 <div class="card"><h3>Viaje asignado</h3>${v?`<p><b>${v.pn}</b> · ${v.tel}</p><p>Retiro: <b>${v.or}</b></p><p>Destino: <b>${v.de||'a confirmar'}</b></p><p>Importe: <b>${M(v.monto)}</b></p><label>Al terminar volver a la cola de:</label><select id="rz"><option ${v.z=='Pinamar'?'selected':''}>Pinamar</option><option ${v.z=='Ostende'?'selected':''}>Ostende</option></select><button class="big o" onclick="fin(${v.id},'Efectivo')">Cobrado en efectivo</button><button class="big" onclick="fin(${v.id},'Tarjeta/MP')">Cobrado con tarjeta / MP</button>`:'<p class="mut">Sin viaje asignado. Cuando te toque en la cola, el pedido aparece acá automáticamente.</p>'}
 <hr><p>Viajes hoy: <b>${c.vj}</b> · Recaudado: <b>${M(c.tot)}</b></p></div></div>`}
function vPa(){const t=localStorage.gsm_tel,mis=S.vi.filter(v=>v.tel==t).reverse();
 return`<div class="cover" style="background-image:url(${IMG[1]})"><h2>¿A dónde vamos?</h2><p>Tu remís en Pinamar y Ostende, en minutos.</p></div><div class="g2">${formViaje(0)}<div class="card"><h3>Mis viajes</h3>${mis.map(v=>{const c=S.ch.find(x=>x.id==v.ch);return`<div class="q"><span><b>#${v.id}</b> ${ESTV[v.est]}<br>${v.or} → ${v.de||'-'}<br>${c?'Móvil '+c.mv+' · '+c.n+' · '+c.pat:'Buscando móvil…'}</span><button class="s w" onclick="ticket(${v.id})">🖨 Ticket</button></div>`}).join('')||'<p class="mut">Cuando pidas tu primer remís, vas a ver acá el estado y tu ticket.</p>'}</div></div>`}
/* ===== MAPA ===== */
let map,mk={};
function iniMapa(){if(!window.L)return $('map').innerHTML='<p style="padding:20px">El mapa necesita conexión a internet.</p>';
 if(map){map.remove();map=null}mk={};map=L.map('map').setView(CFG.zonas.Pinamar,14);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap · © CARTO'}).addTo(map);
 Object.entries(CFG.zonas).forEach(([z,p])=>L.circle(p,{radius:900,color:'#0e8a86',weight:1.5,fillOpacity:.07}).addTo(map).bindTooltip('Zona '+z,{permanent:true,direction:'center'}));pintar()}
function pintar(){if(!map)return;const vivos={};
 S.ch.filter(c=>c.est!='off'&&c.lat).forEach(c=>vivos['c'+c.id]=[c.lat,c.lng,c.est=='viaje'?'#0a2236':'#12a672','🚕',c.mv+' · '+c.n]);
 S.vi.filter(v=>(v.est=='pend'||v.est=='curso')&&v.lat).forEach(v=>vivos['p'+v.id]=[v.lat,v.lng,'#e0b04f','🧍',v.pn+' · '+v.or]);
 Object.keys(mk).forEach(k=>{if(!vivos[k]){map.removeLayer(mk[k]);delete mk[k]}});
 Object.entries(vivos).forEach(([k,d])=>{if(mk[k])mk[k].setLatLng([d[0],d[1]]);else mk[k]=L.marker([d[0],d[1]],{icon:L.divIcon({className:'',iconSize:[30,30],html:`<div class="pin" style="background:${d[2]};--pc:${d[2]}99">${d[3]}</div>`})}).addTo(map).bindTooltip(d[4])})}
const W={};function gps(id,q){if(!navigator.geolocation){if(!q)alert('Su dispositivo no permite ubicación.');return}W[id]=navigator.geolocation.watchPosition(p=>{const c=S.ch.find(x=>x.id==id);if(!c)return;c.lat=p.coords.latitude;c.lng=p.coords.longitude;c.gps=1;save()},()=>{delete W[id];if(!q)alert('No se pudo obtener la ubicación. Revise los permisos del navegador.')})}
function miPos(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{ui.gps=[p.coords.latitude,p.coords.longitude];alert('Ubicación capturada ✔')},()=>alert('No se pudo obtener la ubicación.')):alert('Su dispositivo no permite ubicación.')}
/* ===== RELOJES Y SINCRONIZACIÓN ===== */
setInterval(()=>{document.querySelectorAll('[data-c]').forEach(e=>{const c=S.ch.find(x=>x.id==e.dataset.c);if(c)e.firstElementChild&&e.tagName=='TD'?e.firstElementChild.textContent=hms(worked(c)):e.textContent=hms(worked(c))});$('clk').textContent=new Date().toLocaleString('es-AR')},1000);
if(!db)addEventListener('storage',e=>{if(e.key!=K)return;S=load();despachar();refresh()});
function refresh(){if(/INPUT|SELECT/.test(document.activeElement.tagName))return pintar();ui.rol=='operador'&&ui.tab=='mapa'?pintar():R()}
if(ROL)$('sub').remove();$('hero').firstChild.innerHTML=IMG.map(u=>`<div style="background-image:url(${u})"></div>`).join('');

let DI;const inst=$('inst');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e;inst.style.display=''});
addEventListener('appinstalled',()=>inst.style.display='none');
function instalar(){if(DI){DI.prompt();DI=null;inst.style.display='none'}else alert('En iPhone o iPad: tocá Compartir y elegí "Agregar a pantalla de inicio". En Android: menú ⋮ y "Instalar app".')}
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)inst.style.display='';
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.body.classList.add('intro');setTimeout(()=>document.body.classList.remove('intro'),1500);
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.addEventListener('pointermove',e=>{
 const t=e.target.closest&&e.target.closest('.kpi,.cover');document.querySelectorAll('.tilt').forEach(x=>{if(x!==t){x.style.transform='';x.classList.remove('tilt')}});
 if(t){const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;t.classList.add('tilt');t.style.transform=`perspective(800px) rotateY(${px*12}deg) rotateX(${-py*12}deg) translateZ(8px)`}
 const h=$('hero');h.style.setProperty('--mx',(e.clientX/innerWidth-.5).toFixed(3));h.style.setProperty('--my',(e.clientY/innerHeight-.5).toFixed(3))});
sync();R();
</script></body></html>
